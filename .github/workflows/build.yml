name: iOS 编译验证

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Xcode 编译（iOS 模拟器目标）
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（Debug · 模拟器 · 免签名）
        run: |
          xcodebuild build \
            -project Mashangling.xcodeproj \
            -scheme Mashangling \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 运行渲染回归测试（模拟器）
        id: rendertest
        run: |
          xcodebuild test \
            -project Mashangling.xcodeproj \
            -scheme Mashangling \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 导出渲染附件
        if: always() && steps.rendertest.outcome != ''
        run: |
          mkdir -p render-attachments
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path render-attachments/ || true
          ls -la render-attachments/ || true

      - name: 上传渲染结果
        if: always() && steps.rendertest.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: render-attachments
          path: render-attachments/
          if-no-files-found: ignore

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore

  release:
    name: 打包 IPA 并发布 Release
    needs: build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（Release · 真机 · 免签名）
        run: |
          xcodebuild archive \
            -project Mashangling.xcodeproj \
            -scheme Mashangling \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mashangling.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 打包 .ipa
        run: |
          mkdir -p Payload
          cp -r "build/Mashangling.xcarchive/Products/Applications/Mashangling.app" Payload/
          zip -qr Mashangling.ipa Payload
          ls -lh Mashangling.ipa

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Mashangling.ipa \
            --title "码上领 iOS $TAG" \
            --notes "自动构建产物（未签名 IPA）。安装到真机需自行重签名（如 AltStore / Sideloadly / 自签证书）。" \
          || gh release upload "$TAG" Mashangling.ipa --clobber
