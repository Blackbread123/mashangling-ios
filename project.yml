name: Mashangling
options:
  bundleIdPrefix: com.mashangling
  deploymentTarget:
    iOS: "16.0"

targets:
  Mashangling:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Mashangling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashangling.app
        INFOPLIST_FILE: Mashangling/Info.plist
        GENERATE_INFOPLIST: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
